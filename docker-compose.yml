services:
  db:
    image: pgvector/pgvector:pg16
    container_name: smartcampus-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: smartcampus
      POSTGRES_USER: smartcampus
      POSTGRES_PASSWORD: smartcampus_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartcampus -d smartcampus"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: flyway/flyway:10
    container_name: smartcampus-migrate
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/bd/migrations:/flyway/sql/migrations:ro
      - ./backend/bd/seed:/flyway/sql/seed:ro
    command: >
      -url=jdbc:postgresql://db:5432/smartcampus
      -user=smartcampus -password=smartcampus_dev_password
      -locations=filesystem:/flyway/sql/migrations,filesystem:/flyway/sql/seed
      -connectRetries=10 migrate

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartcampus-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      - DATABASE_URL=postgresql+psycopg://smartcampus:smartcampus_dev_password@db:5432/smartcampus
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smartcampus-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  postgres_data:
